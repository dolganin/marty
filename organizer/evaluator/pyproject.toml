[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-rover-evaluator"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "mars-rover-env==0.1.0",
  "numpy>=1.23",
  "stable-baselines3>=2.3",
]

[project.scripts]
mars-rover-score = "mars_rover_evaluator.evaluate:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
