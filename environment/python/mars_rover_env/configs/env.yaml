env:
  episodes_per_trial: 0

  biome_split: 1
  fixed_biome_id: -1
  debug: false





  chain_biomes: true
  # Shorter zones and a higher surprise rate mean the rover crosses more
  # distinct mechanic/terrain regimes inside the fixed 120s run instead of
  # sitting in the same calm zone for most of it (see pla.md section 4).
  chain_zone_count: 14
  chain_segment_min_length: 30.0
  chain_segment_max_length: 70.0
  terrain_surprise_probability: 0.4
  terrain_surprise_strength: 1.0
  difficulty_safe_fraction_min: 0.02
  difficulty_safe_fraction_max: 0.02
  difficulty_exponent: 0.7125
  terrain_profile_frequency_growth: 0.75

terrain:
  sample_count: 4096
  dx: 0.25
  base_height: 0.0
  amplitude: 0.6
  roughness: 0.45
  crater_count: 44
  step_count: 20
  # Difficulty pacing denominator only (physical terrain still spans
  # sample_count*dx=1024m) - shrinking it compresses the calm opening and
  # reaches full difficulty well inside a realistic 120s run.
  length: 420.0

physics:
  dt: 0.016666667
  gravity: -3.71
  wheel_friction: 1.2
  motor_torque: 91.125
  final_drive_ratio: 4.5
  engine_inertia: 0.48
  engine_drag_torque: 7.0
  clutch_sync_rate: 3200.0
  initial_engine_temperature: 20.0
  cold_start_temperature: -25.0
  minimum_operating_temperature: -38.0
  full_power_temperature: 65.0
  overheat_temperature: 115.0
  overheat_restart_temperature: 92.0
  engine_thermal_mass: 8.0
  engine_idle_heat: 2.2
  engine_heat_per_fuel: 3.0
  engine_cooling_conductance: 0.10
  engine_cooling_airflow: 0.08
  engine_heater_energy_rate: 0.15
  engine_heater_heat: 18.0







  # Moderate capacity bump: enough for a short tactical overspeed burst, not
  # enough to bankroll the whole run (see docs on the logarithmic top-end).
  initial_energy: 100.0
  energy_capacity: 130.0




  panel_deploy_time: 1.0
  panel_retract_time: 0.5
  lidar_energy_cost: 0.65
  lidar_scan_duration: 2.0
  lidar_cooldown: 1.25
  lidar_base_range: 24.0
  near_sense_range: 3.0
  brake_strength: 20.0
  body_tilt_torque: 8.0

  safe_landing_speed: 4.0
  safe_landing_angle: 0.55
  ballistic_min_air_steps: 6
  fatal_landing_flip_angle: 2.35

termination:






  finish_x: 0.0
  max_steps: 0
  trial_time_limit: 120.0
  flip_angle: 2.2
  min_energy: 0.0


  stuck_steps: 600
  fatal_fall_y: -8.0

reward:
  progress_scale: 1.0
  energy_cost_scale: 0.01








  flip_penalty: 0.0
  stuck_penalty: 0.0
  finish_bonus: 0.0
