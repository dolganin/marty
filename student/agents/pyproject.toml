[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-rover-student"
version = "0.16.0"
description = "Student PPO training entry point"
requires-python = ">=3.10"
dependencies = [
  "mars-rover-env==0.16.0",
  "numpy>=1.23",
  "stable-baselines3>=2.3",
]

[project.scripts]
mars-rover-train = "mars_rover_student.train:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
