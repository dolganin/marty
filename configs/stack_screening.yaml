# Fixed, short-horizon protocol for candidate-bank screening baselines.
# It preserves the current physics and layered mechanics while making an RL2
# trial small enough to train and re-measure repeatedly on a single GPU.
env:
  episodes_per_trial: 2
  biome_split: 1
  fixed_biome_id: -1
  debug: false
  chain_biomes: true
  chain_zone_count: 8
  chain_segment_min_length: 30.0
  chain_segment_max_length: 70.0
  terrain_surprise_probability: 0.4
  terrain_surprise_strength: 1.0
  difficulty_safe_fraction_min: 0.02
  difficulty_safe_fraction_max: 0.02
  difficulty_exponent: 0.7125
  terrain_profile_frequency_growth: 0.75

terrain:
  sample_count: 4096
  dx: 0.25
  base_height: 0.0
  amplitude: 0.6
  roughness: 0.45
  crater_count: 44
  step_count: 20
  length: 250.0

physics:
  dt: 0.016666667
  gravity: -3.71
  wheel_friction: 1.2
  motor_torque: 115.0
  final_drive_ratio: 4.5
  engine_inertia: 0.48
  engine_drag_torque: 7.0
  clutch_sync_rate: 3200.0
  shift_energy_base: 0.75
  shift_energy_sync_per_krpm: 0.32
  initial_energy: 100.0
  energy_capacity: 130.0
  brake_strength: 20.0
  body_tilt_torque: 8.0
  near_sense_range: 3.0

termination:
  finish_x: 0.0
  max_steps: 1200
  trial_time_limit: 20.0
  flip_angle: 2.2
  min_energy: 0.0
  stuck_steps: 600
  fatal_fall_y: -8.0

reward:
  progress_scale: 1.0
  energy_cost_scale: 0.01
  flip_penalty: 5.0
  stuck_penalty: 0.05
  hard_contact_penalty: 0.2
  finish_bonus: 0.0
