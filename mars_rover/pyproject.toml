[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-rover-env"
version = "0.1.0"
description = "High-performance native 2D Mars rover RL environment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "gymnasium>=0.29",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pybind11>=2.11",
  "pytest>=8",
]
benchmark = [
  "stable-baselines3>=2.3",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mars_rover_env = ["configs/*.yaml", "configs/*.json"]

[project.scripts]
mars-rover-play = "mars_rover_env.tools.play:main"
mars-rover-bootstrap-run = "mars_rover_env.tools.bootstrap_run:main"
mars-rover-doctor = "mars_rover_env.tools.doctor:main"
mars-rover-benchmark = "mars_rover_env.tools.benchmark:main"
mars-rover-generate-biomes = "mars_rover_env.tools.generate_biomes:main"
mars-rover-gate-biomes = "mars_rover_env.tools.evaluate_biomes:main"
mars-rover-train-robust-ppo = "mars_rover_env.tools.train_robust_ppo:main"
mars-rover-anchor-eval = "mars_rover_env.tools.anchor_eval:main"
mars-rover-equate-banks = "mars_rover_env.tools.equate_banks:main"
mars-rover-ranking-stability = "mars_rover_env.tools.ranking_stability:main"
mars-rover-audit-bank = "mars_rover_env.tools.audit_bank:main"
mars-rover-score-bank = "mars_rover_env.tools.score_bank:main"
mars-rover-snapshot-bank = "mars_rover_env.tools.snapshot_bank:main"
