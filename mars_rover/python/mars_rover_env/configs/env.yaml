env:
  episodes_per_trial: 4
  # 1 = train + anchors, 2 = test only, 3 = anchors only, 0 = all (debug).
  biome_split: 1
  fixed_biome_id: -1
  debug: false

terrain:
  sample_count: 4096
  dx: 0.25
  base_height: 0.0
  amplitude: 0.5
  length: 1024.0

physics:
  dt: 0.016666667
  gravity: -3.71
  wheel_friction: 1.2
  motor_torque: 91.125
  final_drive_ratio: 4.5
  engine_inertia: 0.48
  engine_drag_torque: 7.0
  clutch_sync_rate: 3200.0
  initial_engine_temperature: 20.0
  cold_start_temperature: -25.0
  minimum_operating_temperature: -38.0
  full_power_temperature: 65.0
  overheat_temperature: 115.0
  overheat_restart_temperature: 92.0
  engine_heat_rate: 4.5
  engine_cooling_rate: 0.012
  # Measured on gen2: episodes ended on TIMEOUT 21/30, on an empty battery only 8/30, and
  # seven of ten biomes finished with 18-24 of 25 units unused. Energy was decorative, so the
  # optimal policy was simply "drive until the clock runs out" — identical in every biome, which
  # is exactly why a memoryless agent held the ceiling. At 6 units a crossing cannot be made on
  # one charge, so the rover must decide whether this world is worth recharging in.
  initial_energy: 6.0
  energy_capacity: 25.0
  # The panel cycle locked propulsion for 4+3 s = 420 steps = 8.7 m of forgone distance while
  # returning ~1.3 energy at the bank's median solar rate: refusing to charge was correct
  # arithmetic, not a failure to learn. At 1.0+0.5 s the cycle costs ~90 steps, so charging can
  # pay where the sun is strong and still lose where it is not.
  panel_deploy_time: 1.0
  panel_retract_time: 0.5
  lidar_energy_cost: 2.0
  lidar_scan_duration: 1.5
  lidar_cooldown: 2.0
  lidar_base_range: 12.0
  brake_strength: 20.0
  body_tilt_torque: 8.0

termination:
  finish_x: 100.0
  max_steps: 3000  # Finite episodes are required for trial/domain randomization.
  flip_angle: 2.2
  min_energy: 0.0
  stuck_steps: 180

reward:
  progress_scale: 1.0
  energy_cost_scale: 0.01
  # A flip used to cost 5 against a typical run of ~59, i.e. 8% of the prize, so
  # charging blindly into an unknown mechanic was nearly free and probing it never
  # paid for itself. Raising the price is what makes reconnaissance rational: an
  # agent that identifies the world before committing now keeps reward that a
  # memoryless one loses.
  flip_penalty: 30.0
  stuck_penalty: 0.5
  finish_bonus: 100.0
