rover:
  body:
    sprite: rover_body
    mass: 12.0
    inertia: 4.0
    size: [1.8, 0.5]
    collision:
      type: box
      size: [1.8, 0.5]
    local_position: [0.0, 0.0]

  wheels:
    - name: wheel_front
      sprite: rover_wheel
      radius: 0.24
      mass: 1.0
      local_anchor: [0.65, -0.35]
      suspension:
        rest_length: 0.28
        stiffness: 120.0
        damping: 12.0
    - name: wheel_rear
      sprite: rover_wheel
      radius: 0.24
      mass: 1.0
      local_anchor: [-0.65, -0.35]
      suspension:
        rest_length: 0.28
        stiffness: 120.0
        damping: 12.0

  visual_parts:
    - name: camera_mast
      sprite: rover_camera_mast
      parent: body
      local_position: [0.15, 0.45]
      local_rotation: 0.0
      scale: [1.0, 1.0]
    - name: antenna
      sprite: rover_antenna
      parent: body
      local_position: [-0.35, 0.43]
      local_rotation: 0.0
      scale: [1.0, 1.0]
    - name: arm
      sprite: rover_arm
      parent: body
      local_position: [0.75, 0.05]
      local_rotation: 0.0
      scale: [1.0, 1.0]
