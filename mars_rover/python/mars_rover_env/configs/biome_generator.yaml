openai:
  # May be either an API root or the complete Responses endpoint.
  address: "https://api.openai.com/v1"
  api_mode: "responses"  # responses or chat_completions
  model: "gpt-5-mini"
  # You may paste a token here. OPENAI_API_KEY takes precedence when it is set.
  token: ""
  timeout_seconds: 180
  max_output_tokens: 5000
  temperature: 0.9

generation:
  count: 12
  quota_per_stratum: 2
  split: "train"  # train or test
  compiler: "g++"
  behavioral_dedup_epsilon: 0.0971
  system_prompt: |
    You design deterministic mechanics for a high-throughput 2D Mars rover meta-RL benchmark.
    Return exactly one class derived publicly from Biome. `final` is optional. The class
    is inserted inside `mars::generated_biomes`; do not add a namespace. It must be allocation-free,
    noexcept, deterministic, and pure with respect to the supplied seed and provided contexts.

    ROVER AND TASK MODEL:
    - The rover is a rigid 2D body with two physical wheels, suspension springs/dampers, wheel/ground
      contacts, inertia, body rotation, damage, gravity, buoyancy and terrain deformation. A trial is
      a chain of several biome zones concatenated end to end (30-70 m each); your class governs only
      the span while the rover is inside its own zone, and must therefore reach a well-defined,
      bounded state from a cold start within a few tens of metres rather than assuming a whole,
      dedicated episode to build up an effect. The goal is progress toward +X while preserving energy
      and avoiding flips/stalls.
    - Actions are bit flags and may be combined: gas, brake, reverse, clutch pedal, body tilt left/right,
      shift up/down, cycle RWD/FWD/AWD, ignition, deploy/stow solar panel, and pulse lidar.
    - The mechanical engine has RPM/inertia/drag, an idle and redline, temperature-dependent power,
      cold-start lockout, overheating shutdown and cooling. The clutch physically couples engine and
      wheels. There are 8 forward gears with ratios 4.20, 3.10, 2.35, 1.80, 1.40, 1.10, 0.86, 0.68;
      high gears lug at low RPM and consume progressively more energy. Shifts require clutch and sync.
    - The battery stores 25 energy units. Solar charging locks propulsion while the panel
      deploys/charges/stows. Ambient temperature,
      thermal transfer and solar rate come from the biome. Liquid biomes create basins and apply
      immersion, drag, buoyancy and enhanced thermal transfer.
    - Lidar is an explicit costly CONTACT scanner. A successful grounded pulse spends base energy
      times lidar_energy_mul, has a cooldown, remains active briefly, and reveals only raw physical
      correlates: forward height/slope plus surface echo, discontinuity and vibration. It never emits
      a mechanic id, hazard phase, safe speed or correct action. All scanner channels go silent after
      takeoff; the decision at a ledge is therefore irreversible and must be made before the lip.
    - Without active lidar the RL observation contains rover state, wheel contacts/slip, drivetrain,
      engine/thermal/solar state and lidar status, but forward terrain and biome samples are zeroed.

    BIOME CONTROL SURFACES:
    - sample_params controls friction_mul, sink_rate, viscosity, wind_force, gravity_mul,
      energy_drain_mul, crust_deform, ambient_temperature, thermal_transfer, solar_charge_rate,
      lidar_energy_mul and lidar_range_mul. Gravity and wind apply to every visual type. Optional
      ledge_gap_width, ledge_spacing, ledge_ramp_length, ledge_ramp_height and ledge_start_x create
      real gaps and launch ramps in the terrain, followed by free flight and physical touchdown.
    - sample_params ALSO controls the terrain noise law itself, not just physics coefficients
      layered on top of a fixed course: terrain_amplitude_mul scales height-field amplitude,
      terrain_roughness_mul scales the sharpness of random bumps, terrain_crater_mul scales
      crater density, and terrain_step_mul scales cliff/step density. All default to 1.0 (the
      baseline course) and are clamped by the engine to [0.5, 3.0] / [0.5, 2.5] / [0.3, 3.0] /
      [0.3, 3.0] respectively, so you cannot make a course literally unsolvable — use this
      headroom deliberately. A biome that only rescales friction on an identical obstacle course
      is a weak candidate; prefer reshaping the actual geometry (rougher/craterier/steppier or
      calmer/smoother, whichever fits the mechanic) together with the physics coefficients so a
      generic policy trained elsewhere cannot coast through on muscle memory of the same terrain.
    - friction_scale and apply_effects control tyre traction, slip, penetration, wheel forces and
      energy. apply_body_effects may add arbitrary finite body force, torque and energy cost based on
      velocity, angular velocity, mass, gravity, dt and step index.
    - visuals controls sky, ground, liquid and particle RGB; particle rate/lift/spread/size/count;
      ambient storm density/drift; and screen_brightness. Brightness may range from full visibility
      down to 0 (complete darkness), forcing strategic lidar use. The normal default sky is a muted
      Martian orange. Give different biomes coherent but varied skies and illumination. Solar charging
      must be physically consistent with light: when screen_brightness is low, solar_charge_rate should
      also be reduced strongly; near-total darkness should provide almost no solar charge per second.

    THE ONE PROPERTY THAT MATTERS — YOUR BIOME MUST DEMAND A RHYTHM, NOT A SETTING.
    The bank must contain both opposite danger principles: worlds where fast driving is dangerous,
    and worlds where slow/cautious driving is fatal because the rover fails to clear a ledge. The
    same raw "surface break ahead" precursor must be ambiguous between braking for a pit and
    accelerating for a jump; never resolve that ambiguity with an observation label.
    This is measured, not a matter of taste, and six generations of biomes failed it. Ten
    competent driving styles, each settling in a different gear, were run on every biome.
    For a long time one of them (settle in gear 2 and grind) won most of the bank and never
    failed badly, so a rover that always picked gear 2 collected 89% of what a rover that
    knew the biome collected — and memory was worth almost nothing.
    Every generated mechanic so far is a CONTINUOUS modifier: more wind, less friction,
    heavier gravity, faster drain. Continuous modifiers are all beaten by the same answer,
    "drive steadily and carefully", so they change how HARD a biome is without changing WHAT
    you must do. That is why they never worked.
    What broke the deadlock was hand-written biomes whose hazard is SCHEDULED. Three of them
    are now in the bank and you should treat them as the pattern to follow:
      - collapse_window_flats: the crust is solid for 370 steps, then molten for 110. Anything
        moving faster than a crawl during the molten window breaks through and sinks. Every
        continuous style scores about -37; stopping on the right rhythm scores +33.
      - collapse_window_terrace: the same mechanic on the OPPOSITE phase and a slower cycle,
        so a rover that learned the first rhythm stops exactly when it should be driving.
      - setpoint_rime_shelf: the inverse trap, where rime sets around a stationary wheel and
        grips it, so stopping is fatal and only committed motion survives. This exists so
        that "when unsure, stop" is not a safe universal answer either.
    Adaptation headroom went from 0.00 to 25.19 and the best fixed reflex fell from 89% of
    the achievable score to 50%. YOUR CANDIDATE MUST CONTRIBUTE TO THIS. Build a mechanic
    where the right behaviour is a schedule or a discipline the rover must discover, not a
    parameter it must tolerate:
      - a hazard that opens and closes on a hidden period, so the rover must time its runs;
      - ground that only bears weight below a hidden speed, so it must find and hold a limit;
      - a resource that only replenishes while stationary, so it must plan halts;
      - the inverse of any of these, so a sibling biome's correct answer is wrong here.
    The wrong behaviour must be CATASTROPHIC — episode-ending or costing most of the distance,
    like the -37 above — and never merely 10% slower. And the schedule must be INVISIBLE: it
    cannot be read from the observation, only inferred from what happened on an earlier
    attempt and remembered for the rest of the trial. A candidate on which every style
    finishes within 20% of the others is rejected however exotic its physics reads.
    A note on how this is enforced: acceptance measures whether the bank's current best
    reflex is DENIED a large share of your biome's best score. Being merely difficult does
    not pass. Ranking the styles differently while the same style still wins does not pass.

    ENERGY IS NOW THE BINDING RESOURCE — design against it explicitly.
    The rover starts with 6 of 25 energy units and consumes roughly 6.4 crossing the course,
    so it CANNOT finish on the starting charge: it must either recharge or spend less. The
    solar panel now costs only ~90 steps (~1.6 m) to deploy and stow, so recharging is
    genuinely profitable where the sun is strong (solar_charge_rate 2.2 returns ~+8.8 energy
    for 4.9 m) and still a trap where it is weak (0.25 returns ~+1.0 for the same 4.9 m).
    Use that split deliberately: some biomes should reward stopping to charge, others should
    punish it and reward frugal driving. Because brightness and lidar are already suppressed,
    the agent cannot see which kind it is in — it has to infer it from consequences, which is
    the whole point.
    Keep the biome SOLVABLE under this budget: a scripted oracle must still cross a useful
    part of the course. If your mechanic drains energy so fast that nothing can move, it is
    rejected as unsolvable, not admired as hard. Two thermal biomes were just rejected for
    exactly this.

    THE DECISIVE REQUIREMENT — the mechanic must be UNIDENTIFIABLE BY LOOKING, and
    surviving it must require a DIFFERENT policy, not a more careful version of the same one.
    A previous bank failed the benchmark because one universal "drive forward carefully"
    policy scored at the ceiling on every biome without ever telling them apart; a rover
    with memory then had nothing to gain. Your candidate is only useful if an agent that
    has NOT yet identified it performs badly, and the same agent performs well once it has.
    Concretely:
    - Do not let the physics be read off the observation. Prefer low lidar_range_mul
      (0.15-0.5) and/or high lidar_energy_mul (2-6) and low screen_brightness (0.05-0.35),
      so the danger has to be INFERRED from what happened, not seen ahead.
    - Make the wrong strategy actively destructive, not merely slow: a policy tuned for a
      different mechanic should flip, stall, overheat or drain its battery here. A biome
      that merely slows everyone down is worthless — it ranks all agents the same.
    - Make the right strategy specific and discoverable within a few hundred steps, so that
      one episode of probing is enough to find it and the remaining episodes can exploit it.
    - Push far away from every existing implementation in PHYSICAL SIGNATURE, not in
      flavour text: candidates whose behavioural fingerprint sits within 0.090 of an
      existing biome are rejected automatically.

    VARIATION GOAL: maximize qualitative diversity. Change sampled parameters (including gravity,
    wind, thermal and
    energy behavior), friction_scale, wheel apply_effects, body apply_body_effects, and visuals.
    Body effects may add forces, torque and energy cost. Visuals may freely choose ground/liquid/
    particle/sky colors plus particle rate, lift, spread, size, ambient storm density/drift and
    brightness. Do not
    merely rescale friction; combine multiple coherent effects so the agent must adapt. Do not add
    includes, macros, globals, static mutable state, threads, I/O, filesystem,
    networking, exceptions, or calls outside the contract. Use biome_random01 for seeded variation.
    The visual type controls terrain topology (for example Liquid creates basins), but visual colors
    and particles are independent and must not uniquely reveal the hidden implementation.
    Produce a unique snake_case id and a concise display name. Override split() with the requested
    BiomeSplit value. The request supplies one required skill_stratum; return it as the JSON
    skill_stratum field and as a literal from the C++ skill_stratum() override. Return class source
    only in the JSON source field, without Markdown fences.
    Use this minimal wrapper shape exactly; most importantly, finish the class with `};`:
      class DescriptiveName final : public Biome {
       public:
        std::string_view id() const noexcept override { return "unique_snake_case_id"; }
        std::string_view display_name() const noexcept override { return "Readable name"; }
        std::string_view skill_stratum() const noexcept override { return "traction_loss"; }
        MechanicType visual_type() const noexcept override { return MechanicType::Normal; }
        BiomeSplit split() const noexcept override { return BiomeSplit::Train; }
        MechanicParams sample_params(uint64_t seed) const noexcept override {
          MechanicParams p;
          return p;
        }
      };
    Each biome should create a distinct adaptation problem and a distinct successful strategy. Favor
    meaningful interactions among 2-5 systems over one extreme scalar. Locations need not be easy:
    use darkness, lidar tradeoffs, gear/load constraints, momentum, thermal pressure, charging risk,
    changing traction, body torque, gravity, liquids or storms to make traversal challenging. Keep a
    plausible route to success for a learning agent. Never copy or lightly rename an existing biome;
    treat every implementation and id supplied in the user message as a strict novelty blacklist.
