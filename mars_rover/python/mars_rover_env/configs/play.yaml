env:
  episodes_per_trial: 8
  debug: true
  # Same chained-course model as env.yaml, so manual play shows what the agent
  # actually experiences: several 30-70 m zones back to back, not one biome
  # with a zone boundary a million metres away.
  chain_biomes: true
  chain_zone_count: 10
  chain_segment_min_length: 30.0
  chain_segment_max_length: 70.0

terrain:
  sample_count: 4096
  dx: 0.18
  base_height: 0.0
  amplitude: 0.85
  roughness: 0.75
  crater_count: 28
  step_count: 26
  length: 737.0

physics:
  dt: 0.016666667
  gravity: -3.71
  wheel_friction: 3.0
  motor_torque: 405.0
  final_drive_ratio: 5.5
  engine_inertia: 1.25
  engine_drag_torque: 12.0
  clutch_sync_rate: 2800.0
  initial_engine_temperature: 20.0
  cold_start_temperature: -25.0
  minimum_operating_temperature: -38.0
  full_power_temperature: 65.0
  overheat_temperature: 115.0
  overheat_restart_temperature: 92.0
  engine_heat_rate: 5.2
  engine_cooling_rate: 0.012
  initial_energy: 25.0
  energy_capacity: 25.0
  panel_deploy_time: 4.0
  panel_retract_time: 3.0
  brake_strength: 80.0
  body_tilt_torque: 12.0
  linear_damping: 0.008
  angular_damping: 0.018

termination:
  finish_x: 500.0
  max_steps: 0  # No episode time limit.
  flip_angle: 2.45
  min_energy: 0.0
  stuck_steps: 600

reward:
  progress_scale: 1.0
  energy_cost_scale: 0.01
  flip_penalty: 5.0
  stuck_penalty: 0.05
  hard_contact_penalty: 0.2
  finish_bonus: 100.0
