name: Linux CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environment
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            environment/pyproject.toml
            baselines/pyproject.toml
      - name: Install native package
        env:
          MARS_ROVER_BUILD_TYPE: Release
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11
          python -m pip install --editable '.[dev]' --no-build-isolation
      - name: Diagnose installation
        run: python -m mars_rover_env.tools.doctor
      - name: Install baselines
        run: python -m pip install --editable '../baselines[dev]' --no-build-isolation
      - name: Run environment tests
        run: python -m pytest -q
      - name: Run baseline tests
        working-directory: baselines
        run: python -m pytest -q
